<!-- @dsCard group="Timeline" height=300 subtitle="A level in the Timeline, with its class and picks" -->
<div class="ww-root">
  <div class="ww-timeline">
    <div class="ww-level">
      <div class="ww-level__num">3</div>
      <div class="ww-level__body">
        <div class="ww-level__class">Fighter <small>3rd level</small></div>
        <div class="ww-level__picks">
          <button class="ww-pick"><span class="ww-pick__slot">Feat</span>Power Attack</button>
        </div>
      </div>
    </div>
    <div class="ww-level ww-level--active">
      <div class="ww-level__num">4</div>
      <div class="ww-level__body">
        <div class="ww-level__class">Fighter <small>4th level · Strength +1</small></div>
        <div class="ww-level__picks">
          <button class="ww-pick"><span class="ww-pick__slot">Bonus feat</span>Weapon Focus (Longsword)</button>
          <button class="ww-pick ww-pick--gear"><span class="ww-pick__slot">Feat ◈ Gear</span>Two-Weapon Fighting</button>
          <button class="ww-pick ww-pick--empty"><span class="ww-pick__slot">Skills</span>4 ranks to spend</button>
        </div>
      </div>
    </div>
  </div>
</div>
