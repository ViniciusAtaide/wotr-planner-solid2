<!-- @dsCard group="Picker" height=560 subtitle="The picker as a full-screen sheet on a phone" -->
<div class="ww-root" style="height:540px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:0">
  <section class="ww-sheet ww-fade" aria-label="Bonus feat picker">
    <div class="ww-sheet__bar">
      <button class="ww-btn ww-btn--ghost" aria-label="Back to Timeline">← Back</button>
      <h2>Bonus feat · L4</h2>
    </div>
    <div class="ww-sheet__body">
      <div class="ww-options">
        <button class="ww-option ww-option--selected"><span class="ww-option__name">Weapon Focus (Longsword)</span><span class="ww-option__badges"><span class="ww-badge ww-badge--open">✓ Open</span></span></button>
        <button class="ww-option"><span class="ww-option__name">Power Attack</span><span class="ww-option__badges"><span class="ww-badge ww-badge--open">✓ Open</span></span></button>
        <div class="ww-option ww-option--closed" tabindex="0" aria-disabled="true"><span class="ww-option__name">Cleave</span><span class="ww-option__badges"><span class="ww-badge ww-badge--closed">✕ Closed</span></span><ul class="ww-refusal"><li>Needs Power Attack.</li></ul></div>
      </div>
    </div>
  </section>
</div>
