<!-- @dsCard group="Edits" height=340 subtitle="What a Cascade edit will clear, before it applies" -->
<div class="ww-root">
  <div class="ww-cascade ww-fade" role="dialog" aria-labelledby="cp-title">
    <h3 id="cp-title">Swap Spell Focus</h3>
    <p>Changing Spell Focus (Evocation) to Spell Focus (Conjuration) breaks 3 later picks. They'll be cleared, not moved.</p>
    <ul>
      <li><span>Greater Spell Focus (Evocation)</span><span>Level 8</span></li>
      <li><span>Spell Specialization (Fireball)</span><span>Level 9</span></li>
      <li><span>Elemental Focus (Fire)</span><span>Level 11</span></li>
    </ul>
    <div class="ww-cascade__actions">
      <button class="ww-btn ww-btn--ghost">Cancel <span class="ww-kbd">Esc</span></button>
      <button class="ww-btn ww-btn--primary">Clear 3 picks and apply</button>
    </div>
  </div>
</div>
